<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كَلِمَة - Kalima Arabic Morphology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            amber: '#FFC107',
                            dark: '#000000',
                            surface: '#121212',
                            variant: '#1A1A1A',
                            line: '#333333',
                            muted: '#A0A0A0'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-brand-amber selection:text-black">

    <!-- Main Content Container -->
    <main id="app-content" class="flex-1 max-w-2xl w-full mx-auto p-4 pb-48 overflow-y-auto">
        <!-- Dynamic Views Injected Here -->
    </main>

    <!-- Bottom Fixed Control & Navigation Bar (Matches Android Mockup) -->
    <footer class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur border-t border-brand-line z-50 max-w-2xl mx-auto">
        <div class="p-3 space-y-3">
            
            <!-- Action Toggles Row: Save, Mode, Language -->
            <div class="flex justify-between items-center text-sm">
                <button id="btn-save" onclick="toggleSave()" class="bg-brand-variant text-brand-muted px-4 py-1.5 rounded-full font-semibold transition hover:text-white">Save</button>
                
                <!-- Mode Dropdown -->
                <div class="relative">
                    <button onclick="toggleDropdown('mode-menu')" id="mode-label" class="bg-brand-amber text-black px-4 py-1.5 rounded-full font-semibold flex items-center gap-1">Deep</button>
                    <div id="mode-menu" class="hidden absolute bottom-full mb-2 right-0 bg-brand-surface border border-brand-line rounded-xl shadow-xl overflow-hidden w-32 py-1 z-50">
                        <button onclick="setMode('deep')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Deep</button>
                        <button onclick="setMode('fast')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Fast</button>
                    </div>
                </div>

                <!-- Language Dropdown -->
                <div class="relative">
                    <button onclick="toggleDropdown('lang-menu')" id="lang-label" class="bg-brand-variant text-white px-4 py-1.5 rounded-full font-semibold">Off</button>
                    <div id="lang-menu" class="hidden absolute bottom-full mb-2 right-0 bg-brand-surface border border-brand-line rounded-xl shadow-xl overflow-hidden w-36 py-1 z-50">
                        <button onclick="setLang('off')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Off</button>
                        <button onclick="setLang('ur')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Urdu</button>
                        <button onclick="setLang('fa')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Farsi</button>
                        <button onclick="setLang('tr')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Turkish</button>
                        <button onclick="setLang('ru')" class="w-full text-right px-4 py-2 hover:bg-brand-variant text-white">Russian</button>
                    </div>
                </div>
            </div>

            <!-- Search Bar Row -->
            <div class="flex items-center bg-brand-variant rounded-full p-1.5 border border-brand-line">
                <button onclick="clearSearch()" class="bg-brand-amber text-black w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0">⟳</button>
                <input type="text" id="query-input" placeholder="اكتب كلمة أو ابحث..." class="flex-1 bg-transparent text-right px-4 text-lg focus:outline-none text-white placeholder-brand-muted" dir="rtl" onkeydown="if(event.key === 'Enter') handleLookup()">
                <button onclick="handleLookup()" class="bg-brand-amber text-black w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0">➔</button>
            </div>

            <!-- Bottom Navigation Bar (ك, 💾, 🧠, ⚙️) -->
            <div class="flex justify-between items-center px-4 pt-1">
                <button onclick="switchTab('lookup')" id="nav-lookup" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold bg-brand-amber text-black">ك</button>
                <button onclick="switchTab('saved')" id="nav-saved" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-brand-muted hover:text-white">💾</button>
                <button onclick="switchTab('practice')" id="nav-practice" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-brand-muted hover:text-white">🧠</button>
                <button onclick="switchTab('settings')" id="nav-settings" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-brand-muted hover:text-white">⚙️</button>
            </div>
        </div>
    </footer>

    <!-- App Logic Script -->
    <script>
        var currentTab = 'lookup';
        var lookupMode = 'deep';
        var currentLang = 'off';
        var currentResult = null;
        var savedEntries = JSON.parse(localStorage.getItem('kalima_saved') || '[]');
        var apiKey = localStorage.getItem('kalima_key') || '';

        var pronouns = [
            "هُوَ", "هُمَا (masc. dual)", "هُمْ", "هِيَ", "هُمَا (fem. dual)", "هُنَّ",
            "أَنْتَ", "أَنْتُمَا (masc.)", "أَنْتُمْ", "أَنْتِ", "أَنْتُمَا (fem.)", "أَنْتُنَّ", "أَنَا", "نَحْنُ"
        ];
        var langNames = { ur: 'Urdu', fa: 'Farsi', tr: 'Turkish', ru: 'Russian', off: 'Off' };

        function switchTab(tab) {
            currentTab = tab;
            var tabs = ['lookup', 'saved', 'practice', 'settings'];
            for (var i = 0; i < tabs.length; i++) {
                var t = tabs[i];
                var btn = document.getElementById('nav-' + t);
                if (t === tab) {
                    btn.className = "w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold bg-brand-amber text-black";
                } else {
                    btn.className = "w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-brand-muted hover:text-white";
                }
            }
            render();
        }

        function toggleDropdown(id) {
            var menus = document.querySelectorAll('[id$="-menu"]');
            for (var i = 0; i < menus.length; i++) {
                if (menus[i].id !== id) menus[i].classList.add('hidden');
            }
            document.getElementById(id).classList.toggle('hidden');
        }

        window.onclick = function(e) {
            if (!e.target.closest('button')) {
                var menus = document.querySelectorAll('[id$="-menu"]');
                for (var i = 0; i < menus.length; i++) menus[i].classList.add('hidden');
            }
        };

        function setMode(mode) {
            lookupMode = mode;
            document.getElementById('mode-label').innerText = mode.charAt(0).toUpperCase() + mode.slice(1);
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-label').innerText = langNames[lang] || 'Off';
        }

        function clearSearch() {
            document.getElementById('query-input').value = '';
            currentResult = null;
            render();
        }

        function toggleSave() {
            if (!currentResult) return;
            var index = -1;
            for (var i = 0; i < savedEntries.length; i++) {
                if (savedEntries[i].id === currentResult.word) { index = i; break; }
            }
            if (index > -1) {
                savedEntries.splice(index, 1);
            } else {
                savedEntries.unshift({ id: currentResult.word, data: currentResult, addedAt: Date.now() });
            }
            localStorage.setItem('kalima_saved', JSON.stringify(savedEntries));
            render();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function handleLookup() {
            var query = document.getElementById('query-input').value.trim();
            if (!query) return;
            if (!apiKey) {
                alert("Please configure your Gemini API key in Settings first.");
                switchTab('settings');
                return;
            }

            renderLoading(true);

            try {
                var isArabic = /[\u0600-\u06FF]/.test(query);
                var prompt = "";
                
                if (isArabic) {
                    prompt = "Analyze this Arabic word: " + query + ". Return ONLY one JSON object: {\"word\": \"...\", \"transliteration\": \"...\", \"partOfSpeech\": \"...\", \"grammarNote\": \"...\", \"root\": [...], \"rootGloss\": \"...\", \"wazn\": {\"pattern\": \"...\", \"note\": \"...\"}, \"meaning\": {\"en\": \"...\", \"ar\": \"...\"}, \"examples\": [{\"ar\": \"...\", \"en\": \"...\"}], \"forms\": [...], \"verb\": " + (lookupMode === 'fast' ? 'null' : '{...}') + ", \"synonyms\": [...], \"antonyms\": [...], \"note\": \"...\"}";
                } else {
                    prompt = "Translate \"" + query + "\" into 3-6 accurate Modern Standard Arabic words. Return ONLY JSON: {\"options\": [{\"ar\": \"...\", \"en\": \"...\"}]}";
                }

                var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                var data = await res.json();
                var text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                var parsed = JSON.parse(text);

                if (parsed.options) {
                    renderTranslations(query, parsed.options);
                } else {
                    currentResult = parsed;
                    render();
                }
            } catch (err) {
                alert("Network error or invalid API key.");
                console.error(err);
            } finally {
                renderLoading(false);
            }
        }

        function renderLoading(isLoading) {
            var container = document.getElementById('app-content');
            if (isLoading) {
                container.innerHTML = '<div class="flex items-center justify-center h-64 gap-3 text-brand-amber"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-amber"></div><span>جارٍ التحليل...</span></div>';
            }
        }

        function renderTranslations(query, options) {
            var container = document.getElementById('app-content');
            var html = '<h2 class="text-xl font-bold mb-4">نتائج الترجمة لـ "' + query + '"</h2><div class="space-y-3">';
            for (var i = 0; i < options.length; i++) {
                var opt = options[i];
                html += '<div onclick="selectTranslation(\'' + opt.ar + '\')" class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer hover:border-brand-amber transition flex justify-between items-center">' +
                    '<div><p class="font-medium">' + (opt.en || '') + '</p></div>' +
                    '<p class="text-2xl font-bold text-right font-serif" dir="rtl">' + opt.ar + '</p>' +
                '</div>';
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function selectTranslation(word) {
            document.getElementById('query-input').value = word;
            handleLookup();
        }

        function render() {
            var container = document.getElementById('app-content');
            
            var saveBtn = document.getElementById('btn-save');
            var isSaved = currentResult && savedEntries.some(function(e) { return e.id === currentResult.word; });
            if (isSaved) {
                saveBtn.innerText = "Saved ✓";
                saveBtn.className = "bg-brand-amber text-black px-4 py-1.5 rounded-full font-semibold transition";
            } else {
                saveBtn.innerText = "Save";
                saveBtn.className = "bg-brand-variant text-brand-muted px-4 py-1.5 rounded-full font-semibold transition hover:text-white";
            }

            if (currentTab === 'lookup') {
                if (currentResult) {
                    container.innerHTML = renderResultHTML(currentResult);
                } else {
                    var suggestions = ["كِتَابَةٌ", "مَدْرَسَة", "سَعِيد", "يَسْتَخْدِمُونَ"];
                    var sug = suggestions[Math.floor(Math.random() * suggestions.length)];
                    container.innerHTML = 
                        '<div onclick="document.getElementById(\'query-input\').value=\'' + sug + '\'; handleLookup();" class="bg-brand-surface border border-brand-line rounded-3xl p-8 text-center cursor-pointer hover:border-brand-amber transition shadow-lg">' +
                            '<p class="text-brand-muted text-sm mb-4">كلمة مقترحة</p>' +
                            '<h2 class="text-6xl font-serif font-bold mb-4" dir="rtl">' + sug + '</h2>' +
                            '<p class="text-brand-amber text-sm font-medium">اضغط للبحث والتحليل</p>' +
                        '</div>';
                }
            } else if (currentTab === 'saved') {
                var html = '<h2 class="text-2xl font-bold mb-4">الكلمات المحفوظة (' + savedEntries.length + ')</h2>';
                if (savedEntries.length === 0) {
                    html += '<p class="text-brand-muted">لا توجد كلمات محفوظة بعد.</p>';
                } else {
                    html += '<div class="space-y-3">';
                    for (var i = 0; i < savedEntries.length; i++) {
                        var entry = savedEntries[i];
                        html += '<div onclick=\'openSaved(' + JSON.stringify(entry.data) + ')\' class="bg-brand-surface border border-brand-line p-4 rounded-xl cursor-pointer hover:border-brand-amber transition flex justify-between items-center">' +
                            '<span class="text-brand-muted text-sm">' + new Date(entry.addedAt).toLocaleDateString() + '</span>' +
                            '<span class="text-2xl font-serif font-bold" dir="rtl">' + entry.id + '</span>' +
                        '</div>';
                    }
                    html += '</div>';
                }
                container.innerHTML = html;
            } else if (currentTab === 'practice') {
                container.innerHTML = '<h2 class="text-2xl font-bold mb-4">التمارين والبطاقات</h2><p class="text-brand-muted">ميزة التمارين قيد التفعيل.</p>';
            } else if (currentTab === 'settings') {
                container.innerHTML = 
                    '<div class="space-y-6">' +
                        '<h2 class="text-3xl font-bold text-brand-amber">الإعدادات</h2>' +
                        '<div>' +
                            '<label class="block text-sm text-brand-muted mb-2">مفتاح Gemini API</label>' +
                            '<input type="password" id="setting-key" value="' + apiKey + '" class="w-full bg-brand-surface border border-brand-line rounded-xl p-3 text-white focus:outline-none focus:border-brand-amber">' +
                        '</div>' +
                        '<button onclick="saveSettings()" class="w-full bg-brand-amber text-black font-bold p-3 rounded-xl">حفظ الإعدادات</button>' +
                        '<hr class="border-brand-line">' +
                        '<div>' +
                            '<h3 class="text-lg font-bold mb-2">النسخ الاحتياطي</h3>' +
                            '<button onclick="exportData()" class="w-full border border-brand-amber text-brand-amber font-bold p-3 rounded-xl">تصدير الكلمات المحفوظة (JSON)</button>' +
                        '</div>' +
                    '</div>';
            }
        }

        function openSaved(data) {
            currentResult = data;
            currentTab = 'lookup';
            switchTab('lookup');
        }

        function saveSettings() {
            apiKey = document.getElementById('setting-key').value.trim();
            localStorage.setItem('kalima_key', apiKey);
            alert("تم الحفظ بنجاح!");
            switchTab('lookup');
        }

        function exportData() {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedEntries, null, 2));
            var dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "Kalima_Backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function renderResultHTML(w) {
            var rootHTML = '';
            if (w.root && w.root.length > 0) {
                rootHTML = '<div class="flex gap-2 justify-end" dir="rtl">';
                for (var i = 0; i < w.root.length; i++) {
                    rootHTML += '<div class="w-12 h-14 bg-brand-amber text-black rounded-xl flex items-center justify-center text-2xl font-bold">' + w.root[i] + '</div>';
                }
                rootHTML += '</div>';
            }

            var verbHTML = '';
            if (w.verb && w.verb.conjugation) {
                var rows = '';
                for (var i = 0; i < 14; i++) {
                    var conjItem = w.verb.conjugation[i] || {};
                    rows += '<tr class="border-t border-brand-line">' +
                        '<td class="p-2 text-right font-serif" dir="rtl">' + (conjItem.present || '—') + '</td>' +
                        '<td class="p-2 text-right font-serif" dir="rtl">' + (conjItem.past || '—') + '</td>' +
                        '<td class="p-2 text-right text-xs text-brand-muted">' + pronouns[i] + '</td>' +
                    '</tr>';
                }
                verbHTML = 
                    '<div class="mt-6">' +
                        '<h3 class="text-lg font-semibold text-brand-amber mb-3">التصريف (14 صيغة)</h3>' +
                        '<div class="overflow-x-auto bg-brand-surface rounded-xl border border-brand-line">' +
                            '<table class="w-full text-sm">' +
                                '<thead class="bg-brand-variant text-brand-muted text-xs">' +
                                    '<tr><th class="p-2 text-right">المضارع</th><th class="p-2 text-right">الماضي</th><th class="p-2 text-right">الضمير</th></tr>' +
                                '</thead>' +
                                '<tbody>' + rows + '</tbody>' +
                            '</table>' +
                        '</div>' +
                    '</div>';
            }

            return '<div class="bg-brand-surface border border-brand-line rounded-3xl p-6 space-y-6 shadow-xl">' +
                '<div class="flex justify-between items-start">' +
                    '<div>' +
                        '<p class="text-sm text-brand-muted">الجذر</p>' +
                        '<p class="font-medium">' + (w.rootGloss || '') + '</p>' +
                    '</div>' +
                    rootHTML +
                '</div>' +
                '<hr class="border-brand-line">' +
                '<div class="text-right">' +
                    '<div class="flex items-center justify-end gap-3 mb-2">' +
                        '<button onclick="speak(\'' + w.word + '\')" class="border border-brand-amber text-brand-amber p-2 rounded-xl text-sm">🔊 استماع</button>' +
                        '<h1 class="text-5xl font-serif font-bold" dir="rtl">' + w.word + '</h1>' +
                    '</div>' +
                    '<p class="text-brand-muted italic">' + (w.transliteration || '') + '</p>' +
                '</div>' +
                '<div>' +
                    '<h3 class="text-lg font-semibold text-brand-amber mb-1">المعنى</h3>' +
                    '<p class="text-lg">' + w.meaning.en + '</p>' +
                    '<p class="text-xl font-serif mt-2 text-right" dir="rtl">' + w.meaning.ar + '</p>' +
                '</div>' +
                (w.examples && w.examples.length ? '<div><h3 class="text-lg font-semibold text-brand-amber mb-2">أمثلة</h3>' + w.examples.map(function(ex){ return '<div class="bg-brand-variant p-3 rounded-xl mb-2 text-right"><p class="font-serif text-lg" dir="rtl">' + ex.ar + '</p><p class="text-sm text-brand-muted">' + ex.en + '</p></div>'; }).join('') + '</div>' : '') +
                verbHTML +
            '</div>';
        }

        render();
    </script>
</body>
</html>
