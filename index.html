<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8F6F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kalima">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="android.css">
  <title>Kalima</title>
  <script src="config.js"></script>
  <script src="search.js"></script>
  <script type="module" src="bootstrap.mjs"></script>
</head>
<body>
  <div id="app">
    <header id="header"><h1 id="title">Kalima</h1><button id="header-word" class="header-word" hidden></button><button id="clear" class="quiet" hidden>Clear</button><button id="history" class="icon" aria-label="Recent searches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3  12 C3  16.97  7.03  21  12  21 C16.97  21  21  16.97  21  12 C21  7.03  16.97  3  12  3 C8.9  3  6.17  4.57  4.55  6.96 L3  9 M3  4 L3  9 L8  9 M12  7 L12  12 L16  14"/></svg></button></header>
    <div id="notice" role="status" hidden></div>
    <div id="undo" role="status" hidden></div>
    <div id="compact" hidden></div>
    <main id="content" tabindex="-1"><p class="boot">Kalima</p></main>
    <footer id="dock">
      <div id="pills"><button id="save-pill" class="pill">Save</button><button id="search-pill" class="pill selected">Ar Word</button><button id="depth-pill" class="pill selected">Deep</button><button id="language-pill" class="pill">Off</button></div>
      <form id="search-form" role="search"><label for="query" class="sr-only" id="query-label">Search</label><input id="query" dir="rtl" lang="ar" type="text" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type an Arabic word…"><button id="submit" class="icon submit" aria-label="Search" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.01  21 L23  12 L2.01  3 L2  10 L15  12 L2  14 Z"/></svg></button></form>
      <nav id="navigation" aria-label="Kalima"><div id="lens" aria-hidden="true"></div>
        <button type="button" data-tab="lookup" aria-label="Lookup" aria-current="page"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M6  6 l20  0 c1.66  0  3  1.34  3  3 l0  12 c0  1.66  -1.34  3  -3  3 l-8  0 l-5  4 l0  -4 L6  24 c-1.66  0  -3  -1.34  -3  -3 L3  9 c0  -1.66  1.34  -3  3  -3 Z"/><text x="16" y="20.5" font-family="Amiri,serif" font-size="16.7" font-weight="700" fill="var(--paper)" text-anchor="middle">ض</text></svg></button>
        <button type="button" data-tab="saved" aria-label="Saved words"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19  21 l-7  -5 l-7  5 L5  5 c0  -1.1  0.9  -2  2  -2 l10  0 c1.1  0  2  0.9  2  2 Z"/></svg></button>
        <button type="button" data-tab="practice" aria-label="Practice"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9  2 c-1.1  0  -2  0.9  -2  2 L3  4 c-1.1  0  -2  0.9  -2  2 l0  14 c0  1.1  0.9  2  2  2 l14  0 c1.1  0  2  -0.9  2  -2 L19  6 c0  -1.1  -0.9  -2  -2  -2 l-2  0 c0  -1.1  -0.9  -2  -2  -2 L9  2 Z M9  4 l6  0 l0  2 L9  6 L9  4 Z M15  11 l-5.5  5.5 L7  14 l1.41  -1.41 L10  14.17 l4.09  -4.09 L15  11 Z"/></svg></button>
        <button type="button" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14  12.94 c0.04  -0.3  0.06  -0.61  0.06  -0.94 c0  -0.32  -0.02  -0.64  -0.07  -0.94 l2.03  -1.58 c0.18  -0.14  0.23  -0.41  0.12  -0.61 l-1.92  -3.32 c-0.12  -0.22  -0.37  -0.29  -0.59  -0.22 l-2.39  0.96 c-0.5  -0.38  -1.03  -0.7  -1.62  -0.94 l-0.36  -2.54 c-0.04  -0.24  -0.24  -0.42  -0.5  -0.42 l-3.82  0 c-0.25  0  -0.46  0.18  -0.5  0.42 l-0.36  2.54 c-0.59  0.24  -1.13  0.57  -1.62  0.94 l-2.39  -0.96 c-0.23  -0.09  -0.49  0  -0.59  0.22 L2.71  8.87 c-0.12  0.21  -0.08  0.47  0.12  0.61 l2.03  1.58 c-0.05  0.3  -0.07  0.63  -0.07  0.94 c0  0.31  0.02  0.64  0.07  0.94 l-2.03  1.58 c-0.18  0.14  -0.23  0.41  -0.12  0.61 l1.92  3.32 c0.12  0.22  0.37  0.29  0.59  0.22 l2.39  -0.96 c0.5  0.38  1.03  0.7  1.62  0.94 l0.36  2.54 c0.05  0.24  0.25  0.42  0.5  0.42 l3.82  0 c0.25  0  0.46  -0.18  0.5  -0.42 l0.36  -2.54 c0.59  -0.24  1.13  -0.56  1.62  -0.94 l2.39  0.96 c0.22  0.08  0.47  0  0.59  -0.22 l1.92  -3.32 c0.12  -0.22  0.07  -0.47  -0.12  -0.61 l-2.01  -1.58 Z M12  15.6 c-1.99  0  -3.6  -1.61  -3.6  -3.6 c0  -1.99  1.61  -3.6  3.6  -3.6 c1.99  0  3.6  1.61  3.6  3.6 c0  1.99  -1.61  3.6  -3.6  3.6 Z"/></svg></button>
      </nav>
    </footer>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-panel"><div class="grabber" aria-hidden="true"></div><header><h2 id="sheet-title"></h2><button id="sheet-close" class="quiet">Close</button></header><div id="sheet-body"></div></div></dialog>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <noscript>Kalima needs JavaScript enabled to look up words and display saved content.</noscript>
</body>
</html>
