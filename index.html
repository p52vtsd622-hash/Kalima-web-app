<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8F6F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kalima">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Kalima</title>
  <script src="config.js"></script>
  <script src="search.js"></script>
  <script type="module" src="bootstrap.mjs"></script>
</head>
<body>
  <div id="app">
    <header id="header"><h1 id="title">Kalima</h1><button id="clear" class="quiet" hidden>Clear</button><button id="history" class="icon" aria-label="Recent searches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 1.55-5.04L3 9m0-5v5h5m4-2v5l4 2"/></svg></button></header>
    <div id="notice" role="status" hidden></div>
    <div id="undo" role="status" hidden></div>
    <div id="compact" hidden></div>
    <main id="content" tabindex="-1"><p class="boot">Kalima</p></main>
    <footer id="dock">
      <div id="pills"><button id="save-pill" class="pill">Save</button><button id="search-pill" class="pill selected">Ar Word</button><button id="depth-pill" class="pill selected">Deep</button><button id="language-pill" class="pill">Off</button></div>
      <form id="search-form" role="search"><label for="query" class="sr-only" id="query-label">Search</label><input id="query" dir="rtl" lang="ar" type="text" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type an Arabic word…"><button id="submit" class="icon submit" aria-label="Search" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14 0m-6-6 6 6-6 6"/></svg></button></form>
      <nav id="navigation" aria-label="Kalima"><div id="lens" aria-hidden="true"></div>
        <button type="button" data-tab="lookup" aria-label="Lookup" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/><text x="12" y="13.5" font-family="Amiri,serif" font-size="11" font-weight="bold" fill="var(--paper)" text-anchor="middle">ض</text></svg></button>
        <button type="button" data-tab="saved" aria-label="Saved words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7.58 2 4 5.58 4 10c0 2.08.8 3.97 2.1 5.39.3.33.47.76.47 1.21V19c0 1.1.9 2 2 2h3.5v-2H9v-2.18c0-.98-.4-1.92-1.09-2.62C6.72 13.01 6 11.59 6 10c0-3.31 2.69-6 6-6s6 2.69 6 6c0 1.59-.72 3.01-1.91 4.2-.69.7-1.09 1.64-1.09 2.62V19h-1.5v2H15c1.1 0 2-.9 2-2v-2.4c0-.45.17-.88.47-1.21C18.8 13.97 19.6 12.08 19.6 10c0-4.42-3.58-8-7.6-8z"/></svg></button>
        <button type="button" data-tab="practice" aria-label="Practice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></button>
        <button type="button" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2"/></svg></button>
      </nav>
    </footer>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-panel"><div class="grabber" aria-hidden="true"></div><header><h2 id="sheet-title"></h2><button id="sheet-close" class="quiet">Close</button></header><div id="sheet-body"></div></div></dialog>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <noscript>Kalima needs JavaScript enabled to look up words and display saved content.</noscript>
</body>
</html>
